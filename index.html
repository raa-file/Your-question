h1,h2,h3,h4{line-height:1.3;margin:0 0 .5em}
p{margin:0 0 1em}
a{color:var(--violet)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- الشريط العلوي ---------- */
.mode-bar{background:var(--sun-soft);color:var(--sun-ink);font-size:14px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--sun) 40%,transparent)}
.mode-bar.live{background:var(--mint-soft);color:var(--mint);border-color:color-mix(in srgb,var(--mint) 30%,transparent)}
.mode-bar.err{background:var(--rose-soft);color:var(--rose)}
.mode-bar .wrap{display:flex;gap:8px;align-items:flex-start}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:900;font-size:20px;white-space:nowrap}
.brand svg{flex:none}
nav.main{display:flex;gap:4px;margin-inline-start:auto}
nav.main a{text-decoration:none;color:var(--ink-2);font-weight:700;font-size:15px;padding:8px 12px;border-radius:999px;display:flex;gap:6px;align-items:center}
nav.main a .ic{display:none}
nav.main a:hover{color:var(--ink);background:var(--surface)}
nav.main a.active{color:var(--violet);background:var(--lav)}
.top-actions{display:flex;gap:8px;align-items:center}
.score-chip{display:flex;align-items:center;gap:6px;border:0;background:var(--sun-soft);color:var(--sun-ink);font-weight:800;padding:7px 14px;border-radius:999px;cursor:pointer}
.teacher-link{font-size:14px;font-weight:700;text-decoration:none;color:var(--ink-2);border:1.5px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap}
.teacher-link.active{border-color:var(--violet);color:var(--violet)}
@media (max-width:860px){
  header.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--paper)}
  header.top .wrap{height:60px;gap:10px}
  .brand{font-size:18px}
  nav.main{position:fixed;bottom:0;inset-inline:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:0;margin:0}
  nav.main a{flex-direction:column;gap:0;font-size:12px;padding:4px 6px;border-radius:12px;white-space:nowrap}
  nav.main a .ic{display:block;font-size:20px;line-height:1.3}
  .top-actions{margin-inline-start:auto}
  body{padding-bottom:84px}
}

/* ---------- أزرار وعناصر عامة ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-weight:800;font-size:16px;padding:13px 22px;border-radius:999px;text-decoration:none;transition:transform .15s,background .15s,box-shadow .15s;min-height:48px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--violet);color:var(--violet-ink);box-shadow:var(--shadow)}
.btn-primary:hover{background:color-mix(in srgb,var(--violet) 88%,#000)}
.btn-sun{background:var(--sun);color:#3A2400}
.btn-line{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn-line:hover{border-color:var(--violet);color:var(--violet)}
.btn-ghost{background:transparent;color:var(--ink-2);padding-inline:12px}
.btn-sm{font-size:14px;padding:8px 14px;min-height:38px}
.btn-mint{background:var(--mint-soft);color:var(--mint)}
.btn-rose{background:var(--rose-soft);color:var(--rose)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-inline-end-color:transparent;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.s-pending{background:var(--sun-soft);color:var(--sun-ink);border-color:transparent}
.chip.s-approved{background:var(--mint-soft);color:var(--mint);border-color:transparent}
.chip.s-rejected{background:var(--rose-soft);color:var(--rose);border-color:transparent}
.muted{color:var(--ink-2)}
.small{font-size:14px}
section.block{padding:56px 0}
.page-head{padding:40px 0 8px}
.page-head h1{font-size:clamp(28px,4vw,40px);font-weight:900}
.page-head p{color:var(--ink-2);max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.empty{text-align:center;padding:48px 20px;color:var(--ink-2)}
.empty .big{font-size:44px;display:block;margin-bottom:8px}
.state-box{display:flex;align-items:center;justify-content:center;gap:12px;padding:40px;color:var(--ink-2)}
.err-box{background:var(--rose-soft);color:var(--rose);border-radius:var(--r-md);padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---------- فقاعات ورقة الإجابة (العنصر المميز) ---------- */
.bubble{width:40px;height:40px;flex:none;border-radius:50%;border:2.5px solid var(--ink-3);display:grid;place-items:center;font-weight:900;font-size:17px;color:var(--ink-2);background:var(--surface);transition:all .18s}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:10px 14px;cursor:pointer;font-weight:600;font-size:17px;min-height:60px;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--violet-2)}
.opt:hover:not([disabled]) .bubble{border-color:var(--violet)}
.opt.picked{border-color:var(--violet);background:var(--lav)}
.opt.picked .bubble{background:var(--violet);border-color:var(--violet);color:var(--violet-ink);transform:scale(1.06)}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.right .bubble{background:var(--mint);border-color:var(--mint);color:#fff}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.opt.wrong .bubble{background:var(--rose);border-color:var(--rose);color:#fff}
.opt[disabled]{cursor:default}
.opt .t{flex:1}
.opt .mark{font-size:20px}
.feedback{border-radius:var(--r-md);padding:14px 18px;margin-top:16px;animation:pop .35s ease}
.feedback.ok{background:var(--mint-soft)}
.feedback.no{background:var(--rose-soft)}
.feedback strong{display:block;font-size:18px}
.feedback.ok strong{color:var(--mint)} .feedback.no strong{color:var(--rose)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.q-text{font-size:21px;font-weight:800;margin:6px 0 18px;line-height:1.6}

/* ---------- الرئيسية ---------- */
.hero{position:relative;overflow:hidden;padding:56px 0 64px;background:
  radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--violet) 18%,transparent) 1.2px,transparent 0) 0 0/22px 22px}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:120px;background:linear-gradient(to top,var(--paper),transparent);pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;position:relative;z-index:1}
.hero h1{font-size:clamp(44px,7vw,78px);font-weight:900;letter-spacing:-.5px;margin-bottom:.15em;line-height:1.1}
.hero .tag{font-size:clamp(20px,2.4vw,26px);font-weight:800;color:var(--violet);margin-bottom:16px}
.hero .lead{color:var(--ink-2);max-width:46ch;font-size:18px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.sheet{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:26px;border:1px solid var(--line);position:relative;transform:rotate(-1.2deg)}
.sheet::before{content:"";position:absolute;inset-block:22px;inset-inline-start:-10px;width:20px;background:radial-gradient(circle,var(--paper) 6px,transparent 7px) 0 0/20px 34px}
.sheet .sheet-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed var(--line);padding-bottom:12px;margin-bottom:14px;font-size:14px;color:var(--ink-2);font-weight:700}
.sheet .q-text{font-size:19px}
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.stats-strip > div{padding:20px 22px;border-inline-start:1px solid var(--line)}
.stats-strip > div:first-child{border-inline-start:0}
.stats-strip b{display:block;font-size:34px;font-weight:900;line-height:1.2;color:var(--ink)}
.stats-strip span{color:var(--ink-2);font-size:15px;font-weight:600}
.demo-note{font-size:13px;color:var(--sun-ink);background:var(--sun-soft);display:inline-block;padding:2px 10px;border-radius:999px;margin-top:10px}
.two-col{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:start}
.goals{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.goals li{display:flex;gap:14px;align-items:flex-start;font-weight:600}
.goals li::before{content:"";width:22px;height:22px;flex:none;margin-top:5px;border-radius:50%;border:2.5px solid var(--violet);background:radial-gradient(circle,var(--violet) 5px,transparent 6px)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.steps li{counter-increment:s;position:relative;padding-top:52px}
.steps li::before{content:counter(s,arabic-indic);position:absolute;top:0;inset-inline-start:0;width:40px;height:40px;border-radius:50%;background:var(--lav);color:var(--violet);display:grid;place-items:center;font-weight:900;font-size:19px}
.steps li:not(:last-child)::after{content:"";position:absolute;top:20px;inset-inline-start:52px;inset-inline-end:-6px;border-top:2px dashed var(--line)}
.steps h3{font-size:18px;font-weight:800;margin-bottom:4px}
.steps p{color:var(--ink-2);font-size:15px}
h2.sec{font-size:clamp(24px,3vw,32px);font-weight:900}
@media (max-width:860px){
  .hero{padding:32px 0 44px}
  .hero .wrap,.two-col{grid-template-columns:1fr;gap:30px}
  .sheet{transform:none}
  .stats-strip{grid-template-columns:repeat(2,1fr)}
  .stats-strip > div:nth-child(3){border-inline-start:0}
  .stats-strip > div:nth-child(n+3){border-top:1px solid var(--line)}
  .steps{grid-template-columns:1fr 1fr}
  .steps li::after{display:none}
  section.block{padding:40px 0}
}

/* ---------- النماذج ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.form-grid .full{grid-column:1/-1}
.field label,.field .lbl{display:block;font-weight:800;margin-bottom:6px;font-size:15px}
.field .hint{font-weight:500;color:var(--ink-3);font-size:13px}
.field input,.field select,.field textarea{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 14px;min-height:48px;transition:border-color .15s}
.field textarea{min-height:100px;resize:vertical;line-height:1.7}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--violet)}
.field .err{display:none;color:var(--rose);font-size:14px;font-weight:700;margin-top:5px}
.field.invalid input,.field.invalid select,.field.invalid textarea,.field.invalid .seg,.field.invalid .opt-edit{border-color:var(--rose)}
.field.invalid .err{display:block}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;padding:4px;gap:4px;background:var(--surface)}
.seg label{margin:0;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;padding:7px 18px;border-radius:999px;font-weight:700;color:var(--ink-2)}
.seg input:checked + span{background:var(--violet);color:var(--violet-ink)}
.seg input:focus-visible + span{outline:3px solid var(--sun)}
.opt-edit{display:grid;gap:10px;border:2px solid transparent;border-radius:var(--r-md)}
.opt-row{display:flex;align-items:center;gap:12px}
.opt-row input[type=text]{flex:1}
.pick-correct{position:relative;cursor:pointer;display:block}
.pick-correct input{position:absolute;opacity:0;width:1px;height:1px}
.pick-correct input:checked + .bubble{background:var(--mint);border-color:var(--mint);color:#fff}
.pick-correct input:focus-visible + .bubble{outline:3px solid var(--sun);outline-offset:2px}
.tf-pick{display:flex;gap:12px;flex-wrap:wrap}
.tf-pick label{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:var(--r-md);padding:8px 18px 8px 10px;cursor:pointer;font-weight:800;position:relative}
.tf-pick input{position:absolute;opacity:0;width:1px;height:1px}
.tf-pick input:checked + .bubble{background:var(--mint);border-color:var(--mint);color:#fff}
.tf-pick input:focus-visible + .bubble{outline:3px solid var(--sun)}
.form-actions{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
.form-alert{display:none;margin-bottom:18px}
.form-alert.show{display:flex}
.success{text-align:center;padding:44px 24px;animation:pop .4s ease}
.success .medal{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;background:var(--sun-soft);display:grid;place-items:center;font-size:56px;animation:bounce 1s ease}
@keyframes bounce{0%{transform:scale(.4)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.side-tips{position:sticky;top:90px}
.side-tips ul{padding-inline-start:20px;margin:0;color:var(--ink-2)}
.side-tips li{margin-bottom:8px}
.submit-layout{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
@media (max-width:860px){.form-grid{grid-template-columns:1fr}.submit-layout{grid-template-columns:1fr}.side-tips{position:static}}

/* ---------- البنك ---------- */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:18px 0 22px}
.filters input,.filters select{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 14px;min-height:48px;width:100%}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--violet)}
.q-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.q-item{text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.q-item:hover{border-color:var(--violet-2);transform:translateY(-2px)}
.q-item .meta{display:flex;gap:6px;flex-wrap:wrap}
.q-item .qt{font-weight:700;font-size:17px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.q-item .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:14px;color:var(--ink-3)}
.q-item .done{font-weight:800}
.q-item .done.ok{color:var(--mint)} .q-item .done.no{color:var(--rose)}
.count-line{color:var(--ink-2);font-size:15px;margin-bottom:12px}
@media (max-width:860px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}

/* ---------- النافذة المنبثقة ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(15,14,40,.55);animation:fade .2s}
.modal[hidden]{display:none}
.modal .box{background:var(--surface);border-radius:var(--r-xl);width:min(640px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:26px;position:relative;animation:pop .25s ease}
.modal .box.wide{width:min(760px,100%)}
.modal .x{position:absolute;top:14px;inset-inline-end:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);cursor:pointer;font-size:20px}
.modal .row-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}

/* ---------- التحدي ---------- */
.ch-wrap{max-width:720px;margin:0 auto}
.progress{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--violet-2));border-radius:999px;transition:width .4s ease}
.ch-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800;color:var(--ink-2);font-size:15px}
.ch-dots{display:flex;gap:6px;margin-top:10px}
.ch-dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.ch-dots i.ok{background:var(--mint)} .ch-dots i.no{background:var(--rose)} .ch-dots i.now{background:var(--violet)}
.result-ring{width:150px;height:150px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font-size:38px;font-weight:900}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:16px 12px;text-align:center;color:var(--ink-3)}
.badge .em{font-size:34px;display:block;filter:grayscale(1);opacity:.45}
.badge b{display:block;color:var(--ink-2);font-size:15px}
.badge small{font-size:13px;line-height:1.5;display:block;margin-top:4px}
.badge.on{border-style:solid;border-color:var(--sun);background:var(--sun-soft);color:var(--sun-ink)}
.badge.on .em{filter:none;opacity:1}
.badge.on b{color:var(--ink)}
.me-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.me-grid div{background:var(--surface-2);border-radius:var(--r-md);padding:12px;text-align:center}
.me-grid b{display:block;font-size:26px;font-weight:900}
.me-grid span{font-size:13px;color:var(--ink-2)}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}
@media (max-width:600px){.setup-grid{grid-template-columns:1fr}}

/* ---------- عن المبادرة ---------- */
.about-sec{display:grid;grid-template-columns:220px 1fr;gap:28px;padding:30px 0;border-top:1px solid var(--line)}
.about-sec h2{font-size:22px;font-weight:900;color:var(--violet)}
.skills{display:flex;flex-wrap:wrap;gap:10px}
.skills span{background:var(--lav);color:var(--violet);font-weight:800;padding:8px 16px;border-radius:999px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi div{border:1px solid var(--line);border-radius:var(--r-md);padding:16px;background:var(--surface)}
.kpi b{font-size:30px;font-weight:900;display:block}
.kpi span{color:var(--ink-2);font-size:14px}
@media (max-width:760px){.about-sec{grid-template-columns:1fr;gap:10px}.kpi{grid-template-columns:1fr 1fr}}

/* ---------- لوحة المعلمة ---------- */
.login-box{max-width:420px;margin:30px auto}
.t-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}
.t-stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.t-stats b{font-size:28px;font-weight:900;display:block}
.t-stats span{color:var(--ink-2);font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:800;cursor:pointer;color:var(--ink-2)}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.t-layout{display:grid;grid-template-columns:1fr 290px;gap:22px;align-items:start}
.t-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;margin-bottom:12px}
.t-item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.t-item .qt{font-weight:800;font-size:18px;margin-bottom:8px}
.t-item ul.ans{margin:0 0 8px;padding:0;list-style:none}
.t-item li.c{color:var(--mint);font-weight:800}
.t-item .exp{background:var(--surface-2);border-radius:var(--r-sm);padding:8px 12px;font-size:15px;color:var(--ink-2)}
.t-item .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.top-used{list-style:none;margin:0;padding:0}
.top-used li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.top-used li:last-child{border:0}
.top-used .n{font-weight:900;color:var(--violet)}
@media (max-width:960px){.t-stats{grid-template-columns:repeat(3,1fr)}.t-layout{grid-template-columns:1fr}}
@media (max-width:520px){.t-stats{grid-template-columns:1fr 1fr}}

/* ---------- تنبيه عائم ---------- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(420px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:var(--r-md);font-weight:700;box-shadow:var(--shadow);animation:pop .3s}
@media (max-width:860px){#toast{bottom:96px}}

/* ---------- أيقونات Iconify (مجموعة Solar) مضمّنة ---------- */
svg.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;display:inline-block}
.btn svg.i{width:1.3em;height:1.3em}
nav.main a svg.i{display:none}
.h-ic{display:flex;align-items:center;gap:12px}
.h-ic svg.i{width:1em;height:1em;color:var(--violet)}
.mode-bar svg.i{width:20px;height:20px;margin-top:3px}
.score-chip svg.i{color:var(--sun);width:20px;height:20px}
.modal .x{display:grid;place-items:center;color:var(--ink-2)}
.modal .x svg.i{width:24px;height:24px}
.mark svg.i{width:26px;height:26px}
.opt.right .mark{color:var(--mint)} .opt.wrong .mark{color:var(--rose)}
.bubble svg.i{width:20px;height:20px}
.feedback strong{display:flex!important;align-items:center;gap:8px}
.feedback strong svg.i{width:26px;height:26px}
.empty .big svg.i{width:56px;height:56px;color:var(--violet-2)}
.success .medal svg.i{width:60px;height:60px;color:var(--sun-ink)}
.badge .em svg.i{width:38px;height:38px}
.badge.on .em{color:var(--sun-ink)}
.toast{display:flex;align-items:center;gap:10px}
.toast svg.i{width:24px;height:24px;color:var(--sun)}
.done svg.i{width:18px;height:18px}
.chip svg.i{width:16px;height:16px}
.hero-ic{color:var(--violet);width:.85em!important;height:.85em!important;vertical-align:-.08em!important}
@media (max-width:860px){nav.main a svg.i{display:block;width:24px;height:24px;margin:2px auto 1px}}
footer.foot{padding:30px 0 40px;color:var(--ink-3);font-size:14px;text-align:center}
</style>

const demoDB = { questions: structuredClone(DEMO_SEED), session: null };
const publicShape = q => ({id:q.id, grade:q.grade, subject:q.subject, lesson:q.lesson, type:q.type, question_text:q.question_text, options:q.options, attempts:q.attempts, created_at:q.created_at});
let sb = null;

const api = {
  async getBank({subject = '', grade = ''} = {}){
    if (DEMO){ await wait(250); return demoDB.questions.filter(q => q.status === 'approved' && (!subject || q.subject === subject) && (!grade || q.grade === grade)).map(publicShape); }
    const { data, error } = await sb.rpc('get_question_bank', { p_subject: subject || null, p_grade: grade || null });
    if (error) throw error; return data || [];
  },
  async checkAnswer(id, choice){
    if (DEMO){
      await wait(220);
      const q = demoDB.questions.find(x => x.id === id && x.status === 'approved');
      if (!q) throw new Error('question_not_found');
      const ok = choice === q.correct_index; q.attempts++; if (ok) q.correct_attempts++;
      return { is_correct: ok, correct_index: q.correct_index, explanation: q.explanation };
    }
    const { data, error } = await sb.rpc('check_answer', { p_question_id: id, p_choice: choice });
    if (error) throw error; return data;
  },
  async submit(q){
    const row = {...q, status:'pending'};
    if (DEMO){ await wait(500); demoDB.questions.unshift({...row, id: uid(), attempts:0, correct_attempts:0, created_at:new Date().toISOString()}); return; }
    const { error } = await sb.from('questions').insert(row); // بدون select: الطالبة لا تملك صلاحية القراءة
    if (error) throw error;
  },
  async stats(){
    if (DEMO){
      await wait(150);
      const Q = demoDB.questions, ap = Q.filter(q => q.status === 'approved');
      return { submitted:Q.length, approved:ap.length, subjects:new Set(ap.map(q => q.subject)).size,
        contributors:new Set(Q.map(q => q.author_alias.trim())).size,
        attempts:Q.reduce((s,q) => s + q.attempts, 0), correct:Q.reduce((s,q) => s + q.correct_attempts, 0) };
    }
    const { data, error } = await sb.rpc('get_public_stats'); if (error) throw error; return data;
  },
  /* --- المعلمة --- */
  async signIn(email, password){
    if (DEMO) throw new Error('demo');
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error; return data.session;
  },
  async isTeacher(){
    if (DEMO) return !!demoDB.session;
    const { data: { user } } = await sb.auth.getUser(); if (!user) return false;
    const { data, error } = await sb.from('teachers').select('user_id,display_name').eq('user_id', user.id).maybeSingle();
    if (error) throw error; return data ? (data.display_name || user.email) : false;
  },
  async signOut(){ if (DEMO){ demoDB.session = null; return; } await sb.auth.signOut(); },
  async listAll(){
    if (DEMO){ await wait(250); return structuredClone(demoDB.questions); }
    const { data, error } = await sb.from('questions').select('*').order('created_at', { ascending:false });
    if (error) throw error; return data;
  },
  async update(id, patch){
    if (DEMO){ await wait(300); const q = demoDB.questions.find(x => x.id === id); Object.assign(q, patch); return; }
    const { data: { user } } = await sb.auth.getUser();
    if (patch.status && patch.status !== 'pending'){ patch.reviewed_at = new Date().toISOString(); patch.reviewed_by = user?.id; }
    const { error } = await sb.from('questions').update(patch).eq('id', id);
    if (error) throw error;
  },
  async remove(id){
    if (DEMO){ await wait(300); demoDB.questions = demoDB.questions.filter(x => x.id !== id); return; }
    const { error } = await sb.from('questions').delete().eq('id', id); if (error) throw error;
  }
};

const BADGES = [
  { id:'first',  em:'leaf', name:'بداية الرحلة',  how:'أجيبي عن أول سؤال',                 test: m => Object.keys(m.answered).length >= 1 },
  { id:'maker',  em:'write', name:'صانعة الأسئلة', how:'أرسلي سؤالًا من صياغتك',           test: m => m.submitted >= 1 },
  { id:'critic', em:'brain', name:'المفكرة الناقدة', how:'٥ إجابات صحيحة من المحاولة الأولى', test: m => m.correct >= 5 },
  { id:'star',   em:'crown', name:'نجمة التحدي',   how:'أنهي تحديًا بنسبة ٨٠٪ أو أكثر',    test: m => m.bestPct >= 80 }
];
function checkBadges(){
  for (const b of BADGES) if (!state.me.badges.has(b.id) && b.test(state.me)){ state.me.badges.add(b.id); toast(`حصلتِ على شارة «${b.name}»`, b.em); }
  $('#scoreNum').textContent = ar(state.me.points);
}
// النقاط تُحتسب مرة واحدة لكل سؤال (المحاولة الأولى) — عدالة ومنع تكرار جمع النقاط
function recordAnswer(id, ok){
  if (id in state.me.answered) return 0;
  state.me.answered[id] = ok;
  let earned = 0;
  if (ok){ state.me.points += POINTS; state.me.correct++; earned = POINTS; }
  checkBadges(); return earned;
}

const optLetters = q => q.type === 'tf' ? [ic('check'), ic('cross')] : LETTERS;
function optionsHTML(q, s, action){
  const L = optLetters(q);
  return `<ul class="opts" role="list">${q.options.map((o, i) => {
    let cls = '';
    if (s.result){ if (i === s.result.correct_index) cls = 'right'; else if (i === s.choice) cls = 'wrong'; }
    else if (s.choice === i) cls = 'picked';
    const mark = s.result ? (i === s.result.correct_index ? '<span class="mark" aria-label="الإجابة الصحيحة">' + ic('yes') + '</span>' : (i === s.choice ? '<span class="mark" aria-label="إجابتك">' + ic('no') + '</span>' : '')) : '';
    return `<li><button class="opt ${cls}" data-action="${action}" data-i="${i}" ${s.result || s.loading ? 'disabled' : ''}><span class="bubble">${L[i]}</span><span class="t" dir="auto">${esc(o)}</span>${mark}</button></li>`;
  }).join('')}</ul>`;
}
function feedbackHTML(s, earned){
  if (s.loading) return `<div class="state-box" style="padding:16px"><span class="spin"></span>نتحقق من إجابتك…</div>`;
  if (s.error) return `<div class="err-box" style="margin-top:16px">${esc(s.error)}</div>`;
  if (!s.result) return '';
  const ok = s.result.is_correct;
  return `<div class="feedback ${ok ? 'ok' : 'no'}" role="status"><strong>${ok ? ic('party') + 'إجابة صحيحة!' : ic('no') + 'ليست الإجابة الصحيحة هذه المرة'}</strong>
    ${earned ? `<span class="small">+${ar(earned)} نقاط</span>` : (s.repeat ? '<span class="small muted">أجبتِ عن هذا السؤال سابقًا، لذلك لا تُضاف نقاط جديدة.</span>' : '')}
    <p style="margin:6px 0 0"><b>التفسير:</b> <span dir="auto">${esc(s.result.explanation)}</span></p></div>`;
}

  </div>`;

// قراءة الحقول والتحقق منها — يُعاد استخدامها في التعديل
function readQuestionForm(form, withAlias = true){
  const v = n => (form.elements[n]?.value || '').trim();
  const type = form.querySelector('input[name=type]:checked')?.value || 'mcq';
  const errs = [];
  const q = { grade:v('grade'), subject:v('subject'), lesson:v('lesson'), question_text:v('question_text'), type, explanation:v('explanation') };
  if (withAlias){ q.author_alias = v('author_alias'); if (q.author_alias.length < 2) errs.push('author_alias'); }
  if (!q.grade) errs.push('grade');
  if (!q.subject) errs.push('subject');
  if (q.lesson.length < 2) errs.push('lesson');
  if (q.question_text.length < 5) errs.push('question_text');
  if (q.explanation.length < 3) errs.push('explanation');
  if (type === 'mcq'){
    q.options = [0,1,2,3].map(i => v('opt' + i));
    const c = form.querySelector('input[name=correct]:checked');
    q.correct_index = c ? +c.value : -1;
    const filled = q.options.every(Boolean), unique = new Set(q.options).size === 4;
    if (!filled || !unique || q.correct_index < 0) errs.push('mcq');
  } else {
    q.options = TF.slice();
    const c = form.querySelector('input[name=correctTf]:checked');
    q.correct_index = c ? +c.value : -1;
    if (q.correct_index < 0) errs.push('tf');
  }
  form.querySelectorAll('.field[data-f]').forEach(f => f.classList.toggle('invalid', errs.includes(f.dataset.f)));
  return { q, errs };
}

function bindTypeToggle(form){
  form.addEventListener('change', e => {
    if (e.target.name === 'type'){
      const t = e.target.value;
      form.querySelector('[data-f=mcq]').hidden = t !== 'mcq';
      form.querySelector('[data-f=tf]').hidden = t !== 'tf';
    }
  });
  form.addEventListener('input', e => { const f = e.target.closest('.field[data-f]'); if (f) f.classList.remove('invalid'); });
}

afterRender.submit = () => {
  const form = $('#qForm'); if (!form) return;
  bindTypeToggle(form);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const alert = $('#formAlert'); alert.classList.remove('show');
    const { q, errs } = readQuestionForm(form);
    if (errs.length){
      alert.textContent = 'السؤال غير مكتمل بعد. أكملي الحقول المحددة باللون الأحمر.'; alert.classList.add('show');
      form.querySelector('.field.invalid input, .field.invalid select, .field.invalid textarea')?.focus();
      return;
    }
    const btn = $('#sendBtn'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> جارٍ الإرسال…';
    try {
      await api.submit(q);
      state.me.submitted++; checkBadges();
      submitDone = true; statsCache = null; loadStats(); render(true);
    } catch(err){
      alert.textContent = friendlyError(err) + ' سؤالك ما زال في النموذج، أعيدي المحاولة.'; alert.classList.add('show');
      btn.disabled = false; btn.textContent = 'إرسال السؤال';
    }
  });
};

function openModal(html, wide){ $('#modalBody').innerHTML = html; $('#modal .box').classList.toggle('wide', !!wide); const m = $('#modal'); if (m.hidden){ m.hidden = false; document.body.style.overflow = 'hidden'; $('#modal .x').focus(); } }
function closeModal(){ const m = $('#modal'); if (!m.hidden){ m.hidden = true; document.body.style.overflow = ''; state.player = null; } }
function openPlayer(id){
  const list = filteredBank().map(q => q.id);
  state.player = { list, idx: Math.max(0, list.indexOf(id)), choice: null, result: null, loading: false, error: '', earned: 0 };
  drawPlayer();
}
function drawPlayer(){
  const p = state.player; if (!p) return;
  const q = state.bank.items.find(x => x.id === p.list[p.idx]);
  if (!q){ closeModal(); return; }
  const hasNext = p.idx < p.list.length - 1;
  openModal(`<div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;margin-inline-end:44px">${metaChips(q)}</div>

    </div>`);
}
async function answer(s, q, i, redraw){
  if (s.result || s.loading) return;
  s.choice = i; s.loading = true; s.error = ''; redraw();
  try {
    s.result = await api.checkAnswer(q.id, i);
    s.repeat = q.id in state.me.answered;
    s.earned = recordAnswer(q.id, s.result.is_correct);
  } catch(e){ s.error = friendlyError(e); s.choice = null; }
  s.loading = false; redraw();
}

function viewChallenge(){
  const c = state.ch;

  if (c.phase === 'play'){
    const q = c.qs[c.idx], s = c.s, total = c.qs.length;

    return `<div class="wrap ch-wrap" style="padding:30px 20px 40px">
      <div class="ch-top"><span>سؤال ${ar(c.idx + 1)} من ${ar(total)}</span><span class="h-ic" style="gap:6px">${ic('star')}${ar(c.earned)} نقطة في هذا التحدي</span></div>
      <div class="progress" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <div class="ch-dots">${c.qs.map((_, i) => `<i class="${i < c.marks.length ? (c.marks[i] ? 'ok' : 'no') : (i === c.idx ? 'now' : '')}"></i>`).join('')}</div>

        ${feedbackHTML(s, s.earned)}
        ${s.result ? `<div class="form-actions"><button class="btn btn-primary" data-action="ch-next">${c.idx < total - 1 ? 'السؤال التالي' : 'عرض النتيجة'}</button></div>` : ''}
      </div></div>`;
  }
  if (c.phase === 'done'){
    const total = c.qs.length, right = c.marks.filter(Boolean).length, pct = Math.round(right / total * 100);
    const msg = pct === 100 ? 'علامة كاملة! أنتِ نجمة هذا التحدي' : pct >= 80 ? 'أداء رائع! قريبة جدًا من العلامة الكاملة.' : pct >= 50 ? 'بداية جيدة! راجعي التفسيرات وستتحسن نتيجتك في المرة القادمة.' : 'لا بأس، كل محاولة تعلّم. اقرئي التفسيرات وجرّبي مرة أخرى.';
    const col = pct >= 80 ? 'var(--mint)' : pct >= 50 ? 'var(--sun)' : 'var(--rose)';
    return `<div class="wrap ch-wrap" style="padding:30px 20px 40px"><div class="panel success">
      <div class="result-ring" style="background:conic-gradient(${col} ${pct}%, var(--surface-2) 0)"><span style="background:var(--surface);width:120px;height:120px;border-radius:50%;display:grid;place-items:center">${ar(pct)}٪</span></div>
      <h1 style="font-size:28px;font-weight:900">${esc(msg)}</h1>
      <p class="muted">أجبتِ إجابة صحيحة عن ${ar(right)} من ${ar(total)} أسئلة، وكسبتِ ${ar(c.earned)} نقطة جديدة.</p>
      <div class="form-actions" style="justify-content:center">
        <button class="btn btn-primary" data-action="ch-restart">تحدٍّ جديد</button>
        <button class="btn btn-line" data-action="open-me">${ic('star')} إنجازاتي</button>
      </div></div></div>`;
  }
  return `<div class="wrap ch-wrap" style="padding-bottom:40px">
    <div class="page-head"><h1 class="h-ic">${ic('cup')}تحدي الأسئلة</h1><p>${ar(CH_LEN)} أسئلة عشوائية من بنك الأسئلة المعتمد. كل إجابة صحيحة من المحاولة الأولى تمنحك ${ar(POINTS)} نقاط.</p></div>
    <div class="panel">

      </div>
      ${c.error ? `<div class="err-box" style="margin-bottom:14px">${esc(c.error)}</div>` : ''}
      <button class="btn btn-primary" data-action="start-challenge">ابدئي التحدي</button>
      <p class="small muted" style="margin:14px 0 0">قواعد عادلة للجميع: النقاط تُحتسب مرة واحدة لكل سؤال، ولا تُخصم نقاط عند الخطأ. النقاط محفوظة طوال هذه الجلسة.</p>
    </div></div>`;
}
async function startChallenge(){
  const c = state.ch; c.subject = $('#chSub').value; c.grade = $('#chGrade').value; c.error = '';
  c.phase = 'loading'; render();
  try {
    const items = await api.getBank({ subject: c.subject, grade: c.grade });
    if (!items.length){ c.phase = 'setup'; c.error = 'لا توجد أسئلة معتمدة لهذا الاختيار بعد. اختاري مادة أو صفًّا آخر.'; render(); return; }
    Object.assign(c, { phase:'play', qs: shuffle(items).slice(0, CH_LEN), idx: 0, marks: [], earned: 0, s: { choice:null, result:null } });
  } catch(e){ c.phase = 'setup'; c.error = friendlyError(e); }
  render(true);
}

  const count = st => all.filter(q => q.status === st).length;
  const list = all.filter(q => (f.status === 'all' || q.status === f.status) && (!f.subject || q.subject === f.subject) && (!f.grade || q.grade === f.grade)
    && (!s || [q.question_text, q.lesson, q.author_alias].join(' ').toLowerCase().includes(s)));
  const top = all.filter(q => q.status === 'approved' && q.attempts > 0).sort((a, b) => b.attempts - a.attempts).slice(0, 6);
  const tabs = [['pending','بانتظار المراجعة'],['approved','المعتمدة'],['rejected','المرفوضة'],['all','الكل']];
  const stLabel = { pending:'بانتظار المراجعة', approved:'معتمد', rejected:'مرفوض' };
  let body;
  if (t.loading && !all.length) body = spinner('نجلب الأسئلة…');
  else if (t.error) body = `<div class="err-box">${esc(t.error)}<button class="btn btn-sm btn-line" data-action="t-reload">إعادة المحاولة</button></div>`;
  else if (!list.length) body = `<div class="empty panel"><span class="big">${ic(f.status === 'pending' ? 'party' : 'inbox')}</span>${f.status === 'pending' ? 'لا توجد أسئلة بانتظار المراجعة الآن.' : 'لا توجد أسئلة تطابق هذا الاختيار.'}</div>`;
  else body = list.map(q => `<article class="t-item">
      <div class="meta"><span class="chip s-${q.status}">${stLabel[q.status]}</span>${metaChips(q)}<span class="chip">${ic('book')} ${esc(q.lesson)}</span></div>
      <div class="qt" dir="auto">${esc(q.question_text)}</div>
      <ul class="ans">${q.options.map((o, i) => `<li class="${i === q.correct_index ? 'c' : ''}">${q.type === 'tf' ? '' : optLetters(q)[i] + ') '}<span dir="auto">${esc(o)}</span>${i === q.correct_index ? ' — الإجابة الصحيحة' : ''}</li>`).join('')}</ul>
      <div class="exp"><b>التفسير:</b> <span dir="auto">${esc(q.explanation)}</span></div>
      <p class="small muted" style="margin:8px 0 0">الطالبة: ${esc(q.author_alias)} · ${new Date(q.created_at).toLocaleDateString('ar-SA')}${q.attempts ? ` · ${ar(q.attempts)} محاولة (${ar(Math.round(q.correct_attempts / q.attempts * 100))}٪ صحيحة)` : ''}</p>
      <div class="acts">
        ${q.status !== 'approved' ? `<button class="btn btn-sm btn-mint" data-action="t-approve" data-id="${esc(q.id)}">${ic('yes')} اعتماد</button>` : ''}
        ${q.status !== 'rejected' ? `<button class="btn btn-sm btn-rose" data-action="t-reject" data-id="${esc(q.id)}">${ic('no')} رفض</button>` : ''}
        <button class="btn btn-sm btn-line" data-action="t-edit" data-id="${esc(q.id)}">${ic('edit')} تعديل</button>
        <button class="btn btn-sm btn-ghost" data-action="t-delete" data-id="${esc(q.id)}">${ic('trash')} حذف</button>
      </div></article>`).join('');
  const attempts = all.reduce((x, q) => x + q.attempts, 0);
  return `<div class="wrap" style="padding-bottom:40px">
    <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
      <div><h1>لوحة المعلمة</h1><p style="margin:0">مرحبًا ${esc(typeof t.who === 'string' ? t.who : '')}. الأسئلة لا تظهر في البنك العام إلا بعد اعتمادك.</p></div>
      <div style="display:flex;gap:8px"><button class="btn btn-sm btn-line" data-action="t-reload">${t.loading ? '<span class="spin"></span>' : ic('refresh')} تحديث</button><button class="btn btn-sm btn-ghost" data-action="logout">${ic('logout')} تسجيل الخروج</button></div>
    </div>
    <div class="t-stats">
      <div><b>${ar(all.length)}</b><span>إجمالي المشاركات</span></div>
      <div><b>${ar(count('pending'))}</b><span>بانتظار المراجعة</span></div>
      <div><b>${ar(count('approved'))}</b><span>معتمدة</span></div>
      <div><b>${ar(count('rejected'))}</b><span>مرفوضة</span></div>
      <div><b>${ar(attempts)}</b><span>محاولة حل</span></div>
    </div>
    <div class="t-layout">
      <div>
        <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${f.status === k}" class="${f.status === k ? 'on' : ''}" data-action="t-tab" data-s="${k}">${l}${k !== 'all' ? ` (${ar(count(k))})` : ''}</button>`).join('')}</div>
        <div class="filters" style="margin-top:0">
          <input class="search" type="search" id="tSearch" placeholder="ابحثي في النص أو الدرس أو الاسم المستعار…" value="${esc(f.q)}" aria-label="بحث">
          <select data-tfilter="subject" aria-label="المادة">${selectOpts(SUBJECTS, f.subject, 'كل المواد')}</select>
          <select data-tfilter="grade" aria-label="الصف">${selectOpts(GRADES, f.grade, 'كل الصفوف')}</select>
          <div></div>
        </div>
        ${body}
      </div>
      <aside class="panel"><h3 style="font-size:18px;font-weight:900">الأسئلة الأكثر استخدامًا</h3>
        ${top.length ? `<ul class="top-used">${top.map(q => `<li><span class="n">${ar(q.attempts)}</span> محاولة · ${ar(Math.round(q.correct_attempts / q.attempts * 100))}٪ صحيحة<br><span dir="auto">${esc(q.question_text.slice(0, 70))}${q.question_text.length > 70 ? '…' : ''}</span></li>`).join('')}</ul>` : '<p class="muted small">لم تُحل أي أسئلة بعد.</p>'}
        <p class="small muted" style="margin:10px 0 0">النسبة المنخفضة جدًا قد تعني أن السؤال غامض ويحتاج إلى مراجعة.</p>
      </aside>
    </div></div>`;
}
async function loadTeacher(){
  const t = state.t; t.loading = true; t.error = ''; render();
  try { t.items = await api.listAll(); } catch(e){ t.error = friendlyError(e); }
  t.loading = false; if (state.route === 'teacher') render();
}
async function refreshTeacherSession(){
  try { state.t.who = await api.isTeacher(); } catch(e){ state.t.who = false; toast(friendlyError(e)); }
  if (state.t.who) loadTeacher(); else if (state.route === 'teacher') render();
}
afterRender.teacher = () => {
  const form = $('#loginForm');
  form?.addEventListener('submit', async e => {
    e.preventDefault();
    const a = $('#loginAlert'), btn = $('#loginBtn'), email = $('#lEmail').value.trim(), pass = $('#lPass').value;
    a.classList.remove('show');
    if (!email || !pass){ a.textContent = 'أدخلي البريد الإلكتروني وكلمة المرور.'; a.classList.add('show'); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> جارٍ الدخول…';
    try {
      await api.signIn(email, pass);
      const who = await api.isTeacher();
      if (!who){ await api.signOut(); throw new Error('هذا الحساب غير مسجّل كحساب معلمة. تواصلي مع مسؤولة المنصة.'); }
      state.t.who = who; loadTeacher();
    } catch(err){ a.textContent = /معلمة/.test(err.message) ? err.message : friendlyError(err); a.classList.add('show'); btn.disabled = false; btn.textContent = 'تسجيل الدخول'; }
  });
  const s = $('#tSearch');
  s?.addEventListener('input', () => { state.t.f.q = s.value; const pos = s.selectionStart; render(); const n = $('#tSearch'); n.focus(); n.setSelectionRange(pos, pos); });
  document.querySelectorAll('[data-tfilter]').forEach(el => el.addEventListener('change', () => { state.t.f[el.dataset.tfilter] = el.value; render(); }));
};

async function teacherAction(id, fn, okMsg, btn, icon){
  if (btn){ btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try { await fn(); toast(okMsg, icon); state.bank.loaded = false; statsCache = null; statsErr = ''; await loadTeacher(); }
  catch(e){ toast(friendlyError(e)); render(); }
}
function openEdit(id){
  const q = state.t.items.find(x => x.id === id); if (!q) return;
  openModal(`<h2 id="modalTitle" style="font-weight:900;margin-inline-end:44px">تعديل السؤال</h2>
    <p class="small muted">الطالبة: ${esc(q.author_alias)}</p>
    <form id="editForm" novalidate>${questionFields(q, false)}
      <div class="err-box form-alert" id="editAlert" role="alert" style="margin-top:14px"></div>
      <div class="row-actions">
        <button class="btn btn-ghost" type="button" data-action="close-modal">إلغاء</button>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-line" type="submit" data-mode="save">حفظ التعديلات</button>
          <button class="btn btn-primary" type="submit" data-mode="approve">حفظ واعتماد</button>
        </div></div></form>`, true);
  const form = $('#editForm'); bindTypeToggle(form);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const mode = e.submitter?.dataset.mode || 'save', a = $('#editAlert'); a.classList.remove('show');
    const { q: patch, errs } = readQuestionForm(form, false);
    if (errs.length){ a.textContent = 'أكملي الحقول المحددة قبل الحفظ.'; a.classList.add('show'); return; }
    if (mode === 'approve') patch.status = 'approved';
    form.querySelectorAll('button').forEach(b => b.disabled = true);
    if (e.submitter) e.submitter.innerHTML = '<span class="spin"></span> جارٍ الحفظ…';
    try { await api.update(id, patch); closeModal(); toast(mode === 'approve' ? 'حُفظ السؤال واعتُمد' : 'حُفظت التعديلات', 'yes'); state.bank.loaded = false; statsCache = null; loadTeacher(); }
    catch(err){ a.textContent = friendlyError(err); a.classList.add('show'); form.querySelectorAll('button').forEach(b => b.disabled = false); e.submitter.textContent = mode === 'approve' ? 'حفظ واعتماد' : 'حفظ التعديلات'; }
  });
}
function confirmDelete(id){
  const q = state.t.items.find(x => x.id === id); if (!q) return;
  openModal(`<h2 id="modalTitle" style="font-weight:900">حذف السؤال نهائيًا؟</h2>
    <p class="muted" dir="auto">«${esc(q.question_text)}»</p><p class="small">لا يمكن التراجع عن الحذف. إذا كان السؤال يحتاج تحسينًا فقط، استخدمي «تعديل» أو «رفض».</p>
    <div class="row-actions"><button class="btn btn-ghost" data-action="close-modal">إلغاء</button><button class="btn btn-rose" data-action="t-delete-yes" data-id="${esc(id)}">نعم، احذفي السؤال</button></div>`);
}

/* =====================================================================
   معالج الأحداث الموحّد
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action, i = +el.dataset.i, id = el.dataset.id;
  switch (a){
    case 'open-me': openMe(); break;
    case 'close-modal': closeModal(); break;
    case 'reload-stats': statsErr = ''; statsCache = null; render(); loadStats(); break;
    case 'hero-pick': {
      const s = state.heroPick = { choice: i, result: { is_correct: i === HERO_Q.correct_index, correct_index: HERO_Q.correct_index, explanation: HERO_Q.explanation } };
      render(); break; }
    case 'submit-again': submitDone = false; render(true); break;
    case 'retry-bank': state.bank.error = ''; loadBank(); break;
    case 'clear-filters': state.bank.f = { subject:'', grade:'', lesson:'', q:'' }; render(); break;
    case 'open-q': openPlayer(id); break;
    case 'pick': { const p = state.player; const q = state.bank.items.find(x => x.id === p.list[p.idx]); answer(p, q, i, () => { drawPlayer(); if (!p.loading && p.result) render(); }); break; }
    case 'next-q': { const p = state.player; Object.assign(p, { idx: p.idx + 1, choice:null, result:null, error:'', earned:0, repeat:false }); drawPlayer(); break; }
    case 'start-challenge': startChallenge(); break;
    case 'ch-pick': { const c = state.ch; answer(c.s, c.qs[c.idx], i, () => { if (!c.s.loading && c.s.result && c.marks.length === c.idx){ c.marks.push(c.s.result.is_correct); c.earned += c.s.earned || 0; } render(); }); break; }
    case 'ch-next': { const c = state.ch;
      if (c.idx < c.qs.length - 1){ c.idx++; c.s = { choice:null, result:null }; render(); }
      else { const pct = Math.round(c.marks.filter(Boolean).length / c.qs.length * 100); state.me.challenges++; state.me.bestPct = Math.max(state.me.bestPct, pct); c.phase = 'done'; render(true); checkBadges(); }
      break; }
    case 'ch-restart': state.ch = { phase:'setup', subject: state.ch.subject, grade: state.ch.grade }; render(true); break;
    case 'demo-login': demoDB.session = true; state.t.who = 'المعلمة (عرض تجريبي)'; loadTeacher(); break;
    case 'logout': api.signOut().then(() => { state.t.who = false; state.t.items = []; render(true); toast('تم تسجيل الخروج'); }); break;
    case 't-reload': loadTeacher(); break;
    case 't-tab': state.t.f.status = el.dataset.s; render(); break;
    case 't-approve': teacherAction(id, () => api.update(id, { status:'approved' }), 'اعتُمد السؤال وأصبح ظاهرًا في البنك', el, 'yes'); break;
    case 't-reject': teacherAction(id, () => api.update(id, { status:'rejected' }), 'رُفض السؤال ولن يظهر في البنك', el); break;
    case 't-edit': openEdit(id); break;
    case 't-delete': confirmDelete(id); break;
    case 't-delete-yes': closeModal(); teacherAction(id, () => api.remove(id), 'حُذف السؤال'); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* =====================================================================
   التشغيل
   ===================================================================== */
function setModeBar(kind, html){ const b = $('#modeBar'); b.className = 'mode-bar ' + kind; b.querySelector('.wrap').innerHTML = html; }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('تعذّر تحميل مكتبة Supabase')); document.head.appendChild(s); }); }

async function init(){
  if (DEMO){
    setModeBar('', ic('warn') + '<span><b>وضع تجريبي:</b> المنصة غير متصلة بقاعدة بيانات. الأسئلة المعروضة تجريبية، وأي سؤال أو تعديل يُحفظ مؤقتًا في هذه الصفحة فقط ويختفي عند تحديثها.</span>');
    state.t.who = false;
  } else {
    state.t.who = null;
    try {
      await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
      sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      setModeBar('live', ic('live') + '<span>متصلة بقاعدة البيانات — الأسئلة تُحفظ فعليًا.</span>');
      const [g, s] = await Promise.all([sb.from('grades').select('name').order('sort'), sb.from('subjects').select('name').order('sort')]);
      if (!g.error && g.data?.length) GRADES = g.data.map(x => x.name);
      if (!s.error && s.data?.length) SUBJECTS = s.data.map(x => x.name);
      sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT'){ state.t.who = false; if (state.route === 'teacher') render(); } });
      refreshTeacherSession();
    } catch(e){
      setModeBar('err', ic('err') + '<span>تعذّر الاتصال بقاعدة البيانات، لذلك لن يُحفظ أي شيء الآن. تحققي من الإنترنت أو من إعدادات Supabase في الملف.</span>');
      state.t.who = false;
    }
  }
  window.addEventListener('hashchange', route);
  route();
}
init();
</script>
